name: Maven Package

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions: write-all
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@v4.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          settings-path: $GITHUB_WORKSPACE

      - name: Initialize mandatory git config
        run: |
          git config user.name "GitHub Actions"
          git config user.email noreply@github.com
          git config --global init.defaultBranch main

      - name: Set up custom temp directories
        run: |
          mkdir -p $GITHUB_WORKSPACE/tmp
          mkdir -p $GITHUB_WORKSPACE/junit-tmp
          chmod 777 $GITHUB_WORKSPACE/tmp $GITHUB_WORKSPACE/junit-tmp
          echo "MAVEN_OPTS=-Djava.io.tmpdir=$GITHUB_WORKSPACE/tmp" >> $GITHUB_ENV
          echo "JUNIT_TEMP_DIR=$GITHUB_WORKSPACE/junit-tmp" >> $GITHUB_ENV

      - name: Debug Temp Directories
        run: |
          ls -ld $GITHUB_WORKSPACE/tmp
          ls -ld $GITHUB_WORKSPACE/junit-tmp
          df -h $GITHUB_WORKSPACE/tmp

      - name: Build with Maven
        id: build-with-maven
        run: |
          mvn -B package --file pom.xml \
            -Djunit.jupiter.tempdir=$JUNIT_TEMP_DIR
          echo "my_jar=$(mvn help:evaluate -Dexpression=project.build.finalName -q -DforceStdout).jar" >> $GITHUB_ENV

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2.18.0
        if: always()
        with:
          files: |
            target/surefire-reports/**/*.xml
            target/surefire-reports/**/*.trx
            target/surefire-reports/**/*.json

    outputs:
      my_jar: ${{ env.my_jar }}
